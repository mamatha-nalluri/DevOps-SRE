apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-sre
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mamatha-nalluri/DevOps-SRE.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-sre
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

name: Release Docker Image and Update Kubernetes Manifest

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan-push:
    name: Build, scan, publish and update deployment image
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-sre
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build --pull --target runtime \
            -t "$IMAGE:sha-$GITHUB_SHA" \
            -t "$IMAGE:latest" .

      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devops-sre:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push commit-specific image
        run: docker push "$IMAGE:sha-$GITHUB_SHA"

      - name: Push latest tag
        run: docker push "$IMAGE:latest"

      - name: Update Kubernetes deployment to immutable image tag
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          username = os.environ["DOCKERHUB_USERNAME"]
          sha = os.environ["GITHUB_SHA"]
          path = Path("k8s/base/deployment.yaml")
          text = path.read_text()
          text = text.replace(
              "docker.io/DOCKERHUB_USERNAME/devops-sre:latest",
              f"docker.io/{username}/devops-sre:sha-{sha}",
          )
          path.write_text(text)
          PY

      - name: Commit manifest update for Argo CD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/base/deployment.yaml
          if git diff --cached --quiet; then
            echo "No image-tag change to commit."
          else
            git commit -m "chore(gitops): deploy sha-$GITHUB_SHA [skip ci]"
            git push
          fi

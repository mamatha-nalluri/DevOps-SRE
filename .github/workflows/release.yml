
name: Release Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan-push:
    name: Build, scan and publish
    runs-on: ubuntu-latest

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-sre

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build --pull --target runtime \
            -t "$IMAGE:sha-$GITHUB_SHA" \
            -t "$IMAGE:latest" .

      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devops-sre:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push commit-specific image
        run: docker push "$IMAGE:sha-$GITHUB_SHA"

      - name: Push latest tag
        run: docker push "$IMAGE:latest"

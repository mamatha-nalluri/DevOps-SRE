name: Pull Request CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-lint-sast:
    name: Tests, lint and SAST
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Lint Python code
        run: python -m flake8 app test --select=E9,F63,F7,F82 --show-source --statistics

      - name: Static application security testing
        # B104 is intentionally excluded because the assessment requires the
        # HTTP server to bind to 0.0.0.0 inside its container.
        run: python -m bandit -r app -s B104 -ll

  container-scan:
    name: Build and scan container
    runs-on: ubuntu-latest
    needs: test-lint-sast
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --pull -t devops-sre:pr-${{ github.event.pull_request.number }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devops-sre:pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

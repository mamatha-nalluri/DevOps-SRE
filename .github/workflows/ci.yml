name: Pull Request CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test-lint-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -v
      - name: Full Flake8 lint
        run: python -m flake8 app test --max-line-length=100 --statistics
      - name: Bandit SAST
        run: python -m bandit -r app -s B104 -ll
      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  container-security:
    runs-on: ubuntu-latest
    needs: test-lint-security
    steps:
      - uses: actions/checkout@v4
      - name: Build test stage (runs pytest inside Docker)
        run: docker build --pull --target test -t devops-sre:test .
      - name: Build runtime image
        run: docker build --pull --target runtime -t devops-sre:pr-${{ github.event.pull_request.number }} .
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devops-sre:pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
